<!doctype html>
<html lang="en" data-i18n-wait>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<title>Musaarr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/libre-franklin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script src="i18n.js" defer></script>
<script src="login.js" defer></script>
</head>
<body class="signin-page">
<header class="top">
  <span class="wordmark">musaarr</span>
</header>

<main class="signin" id="signin" aria-busy="true">
  <div class="signin__wait" id="wait" role="status"><span class="visually-hidden" data-i18n="auth.loading"></span></div>

  <form class="signin__form" id="form" novalidate hidden>
    <h1 class="signin__title" id="title"></h1>
    <p class="signin__lead" id="lead"></p>

    <div class="field">
      <label class="field__label" for="name" data-i18n="auth.field.name"></label>
      <input class="field__input" id="name" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" required>
    </div>

    <div class="field">
      <label class="field__label" for="password" data-i18n="auth.field.password"></label>
      <div class="field__row">
        <input class="field__input" id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required aria-describedby="password-hint">
        <button class="btn btn--line btn--auto field__show" id="show" type="button" aria-controls="password" data-i18n="auth.showPassword"></button>
      </div>
      <p class="field__hint" id="password-hint" hidden data-i18n="auth.field.passwordHint"></p>
    </div>

    <p class="signin__error" id="error" role="alert" hidden></p>

    <button class="btn btn--blue signin__submit" id="submit" type="submit"></button>
  </form>

  <div class="notice is-error" id="offline" hidden>
    <p class="notice__text" data-i18n="auth.unreachable"></p>
    <button class="btn btn--line btn--auto" id="retry" type="button" data-i18n="auth.retry"></button>
  </div>
</main>
</body>
</html>
